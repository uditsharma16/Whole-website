<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070508" />
  <meta name="description" content="The Sith Order's Central Archives — every vault, every handbook, every record." />
  <title>TSO — Central Archives</title>
  <script>
    /* Effects mode, applied before the first paint so a remembered or forced choice
       never flashes the full atmosphere first. Same decision app.js makes in
       applyChosenFxMode(): ?fx=lite / ?fx=full force either mode for this tab, a pick
       from the rail switch is remembered across visits, and the automatic verdict
       from the frame-rate guard lasts for this tab only. */
    (function () {
      var mode = new URLSearchParams(location.search).get("fx");
      try {
        if (mode === "lite" || mode === "full") sessionStorage.setItem("tso-fx", mode);
        else mode = localStorage.getItem("tso-fx-pref") || sessionStorage.getItem("tso-fx");
      } catch (e) {}
      if (mode === "lite") document.documentElement.classList.add("fx-lite");
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23070508' d='M0 0h64v64H0z'/%3E%3Cpath fill='none' stroke='%23e3262f' stroke-width='4' stroke-linejoin='round' d='M32 5 55 18v28L32 59 9 46V18Z'/%3E%3Cpath fill='%23e3262f' d='m32 17 8 15-8 15-8-15Z'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="scene-glow scene-glow-blood"></div>
    <div class="scene-glow scene-glow-ember"></div>
    <div class="scene-glow scene-glow-storm"></div>
    <div class="scene-flash" id="sceneFlash"></div>
    <div class="scene-columns"></div>
    <canvas class="scene-embers" id="embers"></canvas>
    <div class="scene-aura"></div>
    <div class="scene-scan"></div>
    <div class="scene-grain"></div>
  </div>

  <!-- Narrow screens only: the rail folds into a drawer behind this bar. -->
  <header class="topbar" id="siteHeader">
    <a class="brand" href="/" data-link aria-label="Central Archives — the gate">
      <svg viewBox="0 0 64 64" aria-hidden="true"><path class="brand-hex" d="M32 5 55 18v28L32 59 9 46V18Z"/><path class="brand-crystal" d="m32 17 8 15-8 15-8-15Z"/><path d="M9 18 32 32 55 18M32 32v27"/></svg>
      <span><strong>TSO</strong><small>Central Archives</small></span>
    </a>
    <button type="button" class="topbar-query" id="searchTriggerMobile" aria-label="Query the archive"><span aria-hidden="true">›_</span></button>
    <button type="button" class="menu-toggle" id="menuToggle" aria-label="Open the archive index" aria-expanded="false" aria-controls="rail"><i></i><i></i></button>
  </header>

  <aside class="rail" id="rail" aria-label="Archive index">
    <a class="brand rail-brand" href="/" data-link aria-label="Central Archives — the gate">
      <svg viewBox="0 0 64 64" aria-hidden="true"><path class="brand-hex" d="M32 5 55 18v28L32 59 9 46V18Z"/><path class="brand-crystal" d="m32 17 8 15-8 15-8-15Z"/><path d="M9 18 32 32 55 18M32 32v27"/></svg>
      <span><strong>TSO</strong><small>Central Archives</small></span>
    </a>
    <button type="button" class="rail-query" id="searchTrigger"><span class="prompt" aria-hidden="true">›</span><span>Query the archive</span><kbd>/</kbd></button>
    <nav class="rail-nav" id="railNav" aria-label="Vaults and records"></nav>
    <div class="rail-foot">
      <span class="sync-pill" id="syncPill" data-state="connecting" title="Content is read live from the Order's Google Site"><i></i><span id="syncStatus">Connecting</span></span>
      <span class="rail-sync" id="footerSync">Source: Google Sites</span>
      <button type="button" class="fx-toggle" id="fxToggle" role="switch" aria-checked="false" aria-label="Lite effects" title="Lite effects: calmer background animation for slower devices">
        <span>Effects</span><span class="fx-toggle-track" aria-hidden="true"><i></i></span><span id="fxToggleState">Full</span>
      </button>
      <a class="rail-source" id="footerSource" href="https://sites.google.com/view/tso-central-archives/home" target="_blank" rel="noopener">Open the Google Site ↗</a>
    </div>
  </aside>
  <div class="reading-progress" id="readingProgress" aria-hidden="true"></div>
  <div class="rail-scrim" id="railScrim" hidden></div>

  <div class="stage">
    <main id="app" tabindex="-1">
      <div class="loading-page">
        <svg class="loader-sigil" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 5 55 18v28L32 59 9 46V18Z"/><path d="m32 17 8 15-8 15-8-15Z"/></svg>
        <p>Unsealing the archives</p>
      </div>
    </main>
    <footer class="colophon">TSO · Central Archives · read live from the Order's Google Site</footer>
  </div>

  <nav class="scrubber" id="scrubber" aria-label="Chapters" hidden>
    <span class="scrub-label" id="scrubLabel" aria-live="polite"></span>
    <div class="scrub-track" id="scrubTrack"><i class="scrub-fill" id="scrubFill"></i><div class="scrub-ticks" id="scrubTicks"></div></div>
  </nav>

  <div class="terminal" id="searchPanel" role="dialog" aria-modal="true" aria-label="Archive terminal" hidden>
    <div class="terminal-frame">
      <div class="terminal-bar"><span><i></i><i></i><i></i></span><b>Archive terminal · TSO-CA</b><span id="searchIndexing"></span><button type="button" id="closeSearch" aria-label="Close the terminal">Esc</button></div>
      <label class="terminal-prompt"><span aria-hidden="true">query ›</span><input id="globalSearch" type="search" placeholder="handbook, trials, ranks…" autocomplete="off" spellcheck="false" aria-label="Search vaults and records" /></label>
      <div class="terminal-results" id="searchResults"></div>
      <div class="terminal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move · <kbd>↵</kbd> open</span><span id="searchCount"></span></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="lightbox" id="lightbox" hidden><button id="lightboxClose" aria-label="Close image">Close</button><img id="lightboxImage" alt="" /><p id="lightboxCaption"></p></div>
  <canvas class="lightning" id="lightning" aria-hidden="true"></canvas>
  <div class="blast-doors" id="blastDoors" aria-hidden="true">
    <div class="door door-top"><span class="door-plate"></span></div>
    <div class="door door-bottom"><span class="door-plate"></span></div>
    <div class="door-seam"></div>
  </div>

  <button type="button" class="droid" id="droid" data-state="connecting" data-side="right" data-vertical="bottom" aria-label="An interrogator droid keeps watch. Drag it to move it, or press for a report." title="Drag me around">
    <span class="droid-float" aria-hidden="true">
      <span class="droid-glow"></span>
      <svg class="droid-body" viewBox="0 0 120 140" width="120" height="140">
        <defs>
          <radialGradient id="droidShell" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#4a3a3e"/><stop offset=".45" stop-color="#1b1215"/><stop offset="1" stop-color="#050304"/></radialGradient>
          <radialGradient id="droidLens" cx="40%" cy="38%" r="60%"><stop offset="0" stop-color="#fff2ec"/><stop offset=".25" class="eye-stop"/><stop offset="1" stop-color="#3a0006"/></radialGradient>
          <linearGradient id="droidBand" x1="0" x2="1"><stop offset="0" stop-color="#2a2023"/><stop offset=".5" stop-color="#6a585c"/><stop offset="1" stop-color="#1a1214"/></linearGradient>
        </defs>
        <path class="droid-needle" d="M60 112v20" stroke="#b9a7a9" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M56 108h8l-1 8h-6Z" fill="#3b2f32"/>
        <path d="M60 8v10" stroke="#6a585c" stroke-width="2"/><circle cx="60" cy="7" r="2.4" class="droid-tip"/>
        <circle cx="60" cy="62" r="46" fill="url(#droidShell)" stroke="#2c2124" stroke-width="1.2"/>
        <path d="M15 58c14 8 76 8 90 0v8c-14 8-76 8-90 0Z" fill="url(#droidBand)" opacity=".85"/>
        <path d="M30 30a40 40 0 0 1 20-12" stroke="rgba(255,240,235,.28)" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle cx="60" cy="48" r="15" fill="#0a0607" stroke="#5a4a4e" stroke-width="1.5"/>
        <circle class="droid-lens" cx="60" cy="48" r="10" fill="url(#droidLens)"/>
        <circle cx="56" cy="44" r="2.6" fill="rgba(255,255,255,.75)"/>
        <g class="droid-lights"><circle cx="34" cy="80" r="1.8"/><circle cx="42" cy="84" r="1.8"/><circle cx="78" cy="84" r="1.8"/><circle cx="86" cy="80" r="1.8"/></g>
      </svg>
    </span>
    <span class="droid-bubble" id="droidBubble" aria-live="polite"></span>
  </button>

  <svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="holoSheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <linearGradient id="holoBeam0" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff3b44" stop-opacity=".85"/><stop offset="1" stop-color="#ff3b44" stop-opacity="0"/></linearGradient>
      <linearGradient id="holoBeam1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff7a2e" stop-opacity=".85"/><stop offset="1" stop-color="#ff7a2e" stop-opacity="0"/></linearGradient>
      <linearGradient id="holoBeam2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#b48cff" stop-opacity=".85"/><stop offset="1" stop-color="#b48cff" stop-opacity="0"/></linearGradient>
      <linearGradient id="holoBeam3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f0b45a" stop-opacity=".85"/><stop offset="1" stop-color="#f0b45a" stop-opacity="0"/></linearGradient>
    </defs>
  </svg>
  <script src="/archive-parse.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
